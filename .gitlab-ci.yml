# Сборка и публикация на GitLab Pages. Сайт статический, base './' в vite.config.ts,
# роутинг на hash-ах, поэтому один билд работает под любым подпутём.
image: node:24-alpine

stages: [verify, deploy]

variables:
  npm_config_cache: $CI_PROJECT_DIR/.npm

# npm ci стирает node_modules, поэтому кэшируем загрузки npm
cache:
  key:
    files: [package-lock.json]
  paths: [.npm/]

# Все ветки, кроме основной: тесты и сборка без публикации
verify:
  stage: verify
  script:
    - npm ci --prefer-offline --no-audit --no-fund
    - npm test
    - npm run build
  rules:
    - if: $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH

# Основная ветка: тесты, сборка и публикация dist/ как public/
pages:
  stage: deploy
  script:
    - npm ci --prefer-offline --no-audit --no-fund
    - npm test
    - npm run build
    - mv dist public
  artifacts:
    paths: [public]
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
