schema: spec-driven

context: |
  Personal client-only Gridfinity generator (no backend): Box/Tray, Baseplate, Cutout modes, modelled on gridfinitygenerator.com.
  Stack: Vite, React, TypeScript, Tailwind CSS (current major), Tabler Icons (current), three.js, manifold-3d (WASM). Deployed to GitHub Pages as a static site.
  All user-visible strings go through i18n with en and ru from the start; no hard-coded UI text.
  Geometry is stored and computed in millimetres; inch is a display/input option only.
  Components are small, single-purpose and grouped by feature; geometry code stays free of React and three.js.
  Specs are written in English; code comments may be Russian.

rules:
  proposal:
    - Change folders are numbered NN-name in implementation order; the NN prefix is the build order.
    - "End the Impact section with a \"Depends on:\" line listing the numbered changes it requires (e.g. `03-geometry-core`), or \"Depends on: none\". Only depend on lower numbers."
    - State what is out of scope.
  tasks:
    - Number tasks as `<section>.<n>` and keep each task independently committable, with its test or verification named in the task.
    - UI tasks cite the matching artboard in `design/artboards/` (map in `design/README.md`) and are done only when the result is compared with it in the browser, in en and ru. If no artboard exists, say so in the task and build from the component library (`Components.dc.html`).
    - Mark the last section of every change as verification (npm test, npm run build, check in the browser).

operations:
  apply:
    guidance:
      - Before starting, check that every change listed under "Depends on" is archived or fully done; if not, stop and say so.
      - Commit after each completed task section.
  archive:
    guidance:
      - Archive changes in numeric order so the main specs stay consistent.
